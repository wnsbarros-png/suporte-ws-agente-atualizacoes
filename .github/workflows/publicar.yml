# Publica uma versão do Suporte WS - Agente neste canal: o .exe e o manifesto assinado (Ed25519) chegam num ramo
# "publicar-vX.Y.Z" e viram a release vX.Y.Z (a mais recente). O ramo pode ser apagado depois.
name: Publicar versão no canal
on:
  push:
    branches: ["publicar-v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir o manifesto
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          doc = json.load(open("manifesto.json", encoding="utf-8"))["manifesto"]
          data = open("SuporteWSAgente.exe", "rb").read()
          assert doc["tamanho"] == len(data), "tamanho não confere"
          assert doc["sha256"] == hashlib.sha256(data).hexdigest(), "sha256 não confere"
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("publicar-")
          assert tag == "v" + doc["versao"], f"ramo {tag} x versão {doc['versao']}"
          open(os.environ["GITHUB_ENV"], "a").write(f"TAG={tag}\n")
          PY
      - name: Criar a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" SuporteWSAgente.exe manifesto.json --title "Suporte WS - Agente ${TAG#v}" \
            --notes-file notas.md --latest --target "$GITHUB_SHA"
